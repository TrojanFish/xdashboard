<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 — Personal Alpha Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #FAF8F5;
            --card-bg: #FFFFFF;
            --text-main: #201E1C;
            --text-muted: #6B665F;
            --border-color: #E8E3DA;
            --claude-accent: #CC5A2B;
            --claude-accent-hover: #B84E22;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Charter", Georgia, serif, monospace;
        }
        .bg-warm-grid {
            background-size: 32px 32px;
            background-image: 
                linear-gradient(to right, rgba(160, 140, 120, 0.06) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(160, 140, 120, 0.06) 1px, transparent 1px);
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .shake {
            animation: shake 0.35s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen bg-warm-grid flex items-center justify-center p-4 relative overflow-hidden select-none">

    <!-- 背景温和柔光氛围 -->
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-[#CC5A2B]/8 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-1/4 left-1/3 w-80 h-80 bg-[#D4A373]/12 rounded-full blur-3xl pointer-events-none"></div>

    <!-- 登录卡片 (Claude 经典纸本温润风格) -->
    <div id="loginCard" class="w-full max-w-md bg-white border border-[#E8E3DA] rounded-2xl shadow-[0_12px_40px_-10px_rgba(60,50,40,0.08)] p-8 relative z-10 space-y-6">
        
        <!-- 头部标识 -->
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-[#CC5A2B]/10 border border-[#CC5A2B]/20 text-[#CC5A2B] mb-2 shadow-sm">
                <span class="text-2xl">✍️</span>
            </div>
            <h1 class="text-xl font-bold tracking-tight text-[#201E1C] font-sans">PERSONAL ALPHA STUDIO</h1>
            <p class="text-xs text-[#706B63] font-mono">AI × Capital Cross-Domain Editorial Studio</p>
            <div class="pt-1 flex items-center justify-center gap-2">
                <span class="w-2 h-2 rounded-full bg-[#386641] animate-pulse"></span>
                <span class="text-[11px] font-mono text-[#386641] font-medium tracking-wider">RESTRICTED ACCESS · PORT 28828</span>
            </div>
        </div>

        <!-- 错误提示框 -->
        <div id="errorAlert" class="hidden bg-[#FFF2F0] border border-[#FFCCC7] rounded-lg p-3 text-xs text-[#CF1322] flex items-center gap-2">
            <span>⚠️</span>
            <span id="errorMsg">密码错误，请重试</span>
        </div>

        <!-- 登录表单 -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-mono uppercase tracking-wider text-[#6B665F] mb-1.5 font-medium">账号 / Username</label>
                <div class="relative">
                    <input 
                        type="text" 
                        id="username" 
                        value="admin" 
                        required 
                        autocomplete="username"
                        class="w-full bg-[#FAF8F5] border border-[#E0DBD2] focus:border-[#CC5A2B] focus:bg-white focus:ring-2 focus:ring-[#CC5A2B]/10 rounded-lg px-3.5 py-2.5 text-sm text-[#201E1C] placeholder-[#9E988F] outline-none transition font-sans"
                        placeholder="admin"
                    >
                    <span class="absolute right-3 top-2.5 text-[#A39D93] text-sm">👤</span>
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label class="block text-xs font-mono uppercase tracking-wider text-[#6B665F] font-medium">访问密钥 / Password</label>
                    <span class="text-[11px] text-[#9E988F] font-mono">.env STUDIO_PASSWORD</span>
                </div>
                <div class="relative">
                    <input 
                        type="password" 
                        id="password" 
                        required 
                        autocomplete="current-password"
                        placeholder="输入工作台访问密码" 
                        class="w-full bg-[#FAF8F5] border border-[#E0DBD2] focus:border-[#CC5A2B] focus:bg-white focus:ring-2 focus:ring-[#CC5A2B]/10 rounded-lg px-3.5 py-2.5 text-sm text-[#201E1C] placeholder-[#9E988F] outline-none transition pr-10 font-sans"
                    >
                    <button 
                        type="button" 
                        onclick="togglePasswordVisibility()" 
                        class="absolute right-3 top-2.5 text-[#A39D93] hover:text-[#201E1C] transition text-sm"
                        id="pwdEyeBtn"
                        title="显示/隐藏密码"
                    >
                        👁️
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between text-xs text-[#6B665F] pt-1">
                <label class="flex items-center gap-2 cursor-pointer select-none">
                    <input type="checkbox" id="rememberMe" checked class="rounded border-[#D5CFB5] text-[#CC5A2B] focus:ring-0">
                    <span>保持登录状态（30 天有效）</span>
                </label>
            </div>

            <button 
                type="submit" 
                id="submitBtn"
                class="w-full bg-[#CC5A2B] hover:bg-[#B84E22] text-white font-medium py-2.5 rounded-lg text-sm shadow-[0_2px_8px_rgba(204,90,43,0.25)] transition-all flex items-center justify-center gap-2 mt-2"
            >
                <span id="btnText">解锁工作台 (Unlock Studio) ⚡</span>
                <span id="btnSpinner" class="hidden animate-spin">⏳</span>
            </button>
        </form>

        <!-- 卡片底部信息 -->
        <div class="pt-4 border-t border-[#EFEAE2] text-center">
            <p class="text-[11px] text-[#8F8A80] leading-relaxed font-sans">
                Personal Alpha Studio · Editorial Edition<br>
                Secured by HMAC Session Auth · Port 28828
            </p>
        </div>

    </div>

    <script>
        // 自动聚焦密码输入框
        window.addEventListener('DOMContentLoaded', () => {
            const pwd = document.getElementById('password');
            if (pwd) pwd.focus();
        });

        function togglePasswordVisibility() {
            const pwd = document.getElementById('password');
            const btn = document.getElementById('pwdEyeBtn');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                btn.innerText = '🙈';
            } else {
                pwd.type = 'password';
                btn.innerText = '👁️';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorAlert = document.getElementById('errorAlert');
            const errorMsg = document.getElementById('errorMsg');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const card = document.getElementById('loginCard');

            // 隐藏错误
            errorAlert.classList.add('hidden');

            // 按钮 Loading 状态
            submitBtn.disabled = true;
            btnText.innerText = '正在验证密钥...';
            btnSpinner.classList.remove('hidden');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (res.ok) {
                    btnText.innerText = '✅ 验证通过，进入系统...';
                    btnSpinner.classList.add('hidden');
                    submitBtn.classList.remove('bg-[#CC5A2B]', 'hover:bg-[#B84E22]');
                    submitBtn.classList.add('bg-[#386641]');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 400);
                } else {
                    errorMsg.innerText = data.detail || '验证失败，请检查密码';
                    errorAlert.classList.remove('hidden');
                    card.classList.remove('shake');
                    void card.offsetWidth; // 触发 reflow 重置动画
                    card.classList.add('shake');
                    submitBtn.disabled = false;
                    btnText.innerText = '解锁工作台 (Unlock Studio) ⚡';
                    btnSpinner.classList.add('hidden');
                    document.getElementById('password').select();
                }
            } catch (err) {
                errorMsg.innerText = '网络连接异常，请确保服务已启动并运行在 28828 端口';
                errorAlert.classList.remove('hidden');
                submitBtn.disabled = false;
                btnText.innerText = '解锁工作台 (Unlock Studio) ⚡';
                btnSpinner.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
