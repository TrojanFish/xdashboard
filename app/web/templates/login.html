<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 — Personal Alpha Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #09090b;
            color: #f4f4f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", monospace;
        }
        .bg-grid {
            background-size: 32px 32px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .shake {
            animation: shake 0.35s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen bg-grid flex items-center justify-center p-4 relative overflow-hidden select-none">

    <!-- 背景科技光晕氛围 -->
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-indigo-600/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-1/4 left-1/3 w-80 h-80 bg-emerald-600/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- 登录卡片 -->
    <div id="loginCard" class="w-full max-w-md bg-zinc-900/80 backdrop-blur-xl border border-zinc-800 rounded-2xl shadow-2xl p-8 relative z-10 space-y-6">
        
        <!-- 头部标识 -->
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-gradient-to-br from-indigo-500/20 to-purple-600/20 border border-indigo-500/30 text-indigo-400 mb-2 shadow-inner">
                <span class="text-2xl animate-pulse">🛰️</span>
            </div>
            <h1 class="text-xl font-bold tracking-wider text-white">PERSONAL ALPHA STUDIO</h1>
            <p class="text-xs text-zinc-400 font-mono">AI × Capital Cross-Domain Intelligence Studio</p>
            <div class="pt-1 flex items-center justify-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                <span class="text-[11px] font-mono text-emerald-400 uppercase tracking-widest">SYSTEM SECURED · PORT 28828</span>
            </div>
        </div>

        <!-- 错误提示框 -->
        <div id="errorAlert" class="hidden bg-rose-500/10 border border-rose-500/30 rounded-lg p-3 text-xs text-rose-300 flex items-center gap-2">
            <span>⚠️</span>
            <span id="errorMsg">密码错误，请重试</span>
        </div>

        <!-- 登录表单 -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-mono uppercase tracking-wider text-zinc-400 mb-1.5">账号 / Username</label>
                <div class="relative">
                    <input 
                        type="text" 
                        id="username" 
                        value="admin" 
                        required 
                        autocomplete="username"
                        class="w-full bg-zinc-950/80 border border-zinc-800 focus:border-indigo-500 rounded-lg px-3.5 py-2.5 text-sm text-zinc-100 placeholder-zinc-600 outline-none transition"
                        placeholder="admin"
                    >
                    <span class="absolute right-3 top-2.5 text-zinc-600 text-sm">👤</span>
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label class="block text-xs font-mono uppercase tracking-wider text-zinc-400">访问密钥 / Password</label>
                    <span class="text-[11px] text-zinc-500">.env STUDIO_PASSWORD</span>
                </div>
                <div class="relative">
                    <input 
                        type="password" 
                        id="password" 
                        required 
                        autocomplete="current-password"
                        placeholder="输入工作台访问密码" 
                        class="w-full bg-zinc-950/80 border border-zinc-800 focus:border-indigo-500 rounded-lg px-3.5 py-2.5 text-sm text-zinc-100 placeholder-zinc-600 outline-none transition pr-10"
                    >
                    <button 
                        type="button" 
                        onclick="togglePasswordVisibility()" 
                        class="absolute right-3 top-2.5 text-zinc-500 hover:text-zinc-300 transition text-sm"
                        id="pwdEyeBtn"
                        title="显示/隐藏密码"
                    >
                        👁️
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between text-xs text-zinc-400 pt-1">
                <label class="flex items-center gap-2 cursor-pointer select-none">
                    <input type="checkbox" id="rememberMe" checked class="rounded bg-zinc-950 border-zinc-800 text-indigo-600 focus:ring-0">
                    <span>保持登录状态（30 天有效）</span>
                </label>
            </div>

            <button 
                type="submit" 
                id="submitBtn"
                class="w-full bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 text-white font-medium py-2.5 rounded-lg text-sm shadow-lg shadow-indigo-600/20 transition-all flex items-center justify-center gap-2 mt-2"
            >
                <span id="btnText">解锁工作台 (Unlock Studio) ⚡</span>
                <span id="btnSpinner" class="hidden animate-spin">⏳</span>
            </button>
        </form>

        <!-- 卡片底部信息 -->
        <div class="pt-4 border-t border-zinc-800/80 text-center">
            <p class="text-[11px] text-zinc-500 leading-relaxed">
                Personal Alpha Studio v1.0<br>
                Protected by HMAC Session Tokens · Overseas VPS Ready
            </p>
        </div>

    </div>

    <script>
        // 自动聚焦密码输入框
        window.addEventListener('DOMContentLoaded', () => {
            const pwd = document.getElementById('password');
            if (pwd) pwd.focus();
        });

        function togglePasswordVisibility() {
            const pwd = document.getElementById('password');
            const btn = document.getElementById('pwdEyeBtn');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                btn.innerText = '🙈';
            } else {
                pwd.type = 'password';
                btn.innerText = '👁️';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorAlert = document.getElementById('errorAlert');
            const errorMsg = document.getElementById('errorMsg');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const card = document.getElementById('loginCard');

            // 隐藏错误
            errorAlert.classList.add('hidden');

            // 按钮 Loading 状态
            submitBtn.disabled = true;
            btnText.innerText = '正在验证密钥...';
            btnSpinner.classList.remove('hidden');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (res.ok) {
                    btnText.innerText = '✅ 验证通过，进入系统...';
                    btnSpinner.classList.add('hidden');
                    submitBtn.classList.remove('from-indigo-600', 'to-indigo-500');
                    submitBtn.classList.add('bg-emerald-600');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 400);
                } else {
                    errorMsg.innerText = data.detail || '验证失败，请检查密码';
                    errorAlert.classList.remove('hidden');
                    card.classList.remove('shake');
                    void card.offsetWidth; // 触发 reflow 重置动画
                    card.classList.add('shake');
                    submitBtn.disabled = false;
                    btnText.innerText = '解锁工作台 (Unlock Studio) ⚡';
                    btnSpinner.classList.add('hidden');
                    document.getElementById('password').select();
                }
            } catch (err) {
                errorMsg.innerText = '网络连接异常，请确保服务已启动并运行在 28828 端口';
                errorAlert.classList.remove('hidden');
                submitBtn.disabled = false;
                btnText.innerText = '解锁工作台 (Unlock Studio) ⚡';
                btnSpinner.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
