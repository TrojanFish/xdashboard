<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Personal Alpha Studio — X 爆款策展工作台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    <style>
        body { background-color: #09090b; color: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden select-none">

    <!-- 顶部导航栏 -->
    <header class="h-14 border-b border-zinc-800 bg-zinc-950 px-6 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-3">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <h1 class="font-bold text-base tracking-wider text-zinc-100">PERSONAL ALPHA STUDIO <span class="text-xs font-normal text-zinc-500 ml-2">AI × Finance Cross-Domain Master Studio</span></h1>
        </div>
        <div class="flex items-center gap-3">
            <!-- 赛道筛选 -->
            <div class="flex bg-zinc-900 p-1 rounded-lg border border-zinc-800 text-xs">
                <button onclick="setFilter('category', 'ALL')" id="cat-ALL" class="px-3 py-1 rounded-md bg-zinc-800 text-white font-medium">全部赛道</button>
                <button onclick="setFilter('category', 'AI_DEV')" id="cat-AI_DEV" class="px-3 py-1 rounded-md text-zinc-400 hover:text-white">AI / 开发</button>
                <button onclick="setFilter('category', 'FINANCE')" id="cat-FINANCE" class="px-3 py-1 rounded-md text-zinc-400 hover:text-white">金融 / 交易</button>
            </div>
            <!-- 状态筛选 -->
            <select id="statusSelect" onchange="setFilter('status', this.value)" class="bg-zinc-900 border border-zinc-800 text-xs text-zinc-300 rounded-lg px-3 py-1.5 outline-none">
                <option value="pending">待发布草稿 (Pending)</option>
                <option value="published">已发布 (Published)</option>
                <option value="archived">已归档跳过 (Archived)</option>
            </select>
            <button onclick="openSourcesModal()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs font-medium px-3.5 py-1.5 rounded-lg transition">⚙️ 监控源配置</button>
            <button onclick="triggerScan()" id="scanBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium px-3.5 py-1.5 rounded-lg transition flex items-center gap-1.5">
                <span>⚡ 立即扫描 Reddit</span>
            </button>
        </div>
    </header>

    <!-- 主体分栏 -->
    <div class="flex-1 flex overflow-hidden">
        <!-- 左侧：高信噪比情报源队列 -->
        <aside class="w-1/3 max-w-md border-r border-zinc-800 bg-zinc-950/60 overflow-y-auto divide-y divide-zinc-800/60" id="feedList">
            <div class="p-8 text-center text-zinc-500 text-sm">正在加载本地草稿库...</div>
        </aside>

        <!-- 右侧：推文精修 + 视觉卡片工作室 -->
        <main class="flex-1 overflow-y-auto p-6 bg-zinc-950" id="editorPane">
            <div class="h-full flex flex-col items-center justify-center text-zinc-600 text-sm">
                👈 点击左侧任意情报卡片，进入二创精修与配图渲染
            </div>
        </main>
    </div>

    <!-- 监控源管理弹窗 -->
    <div id="sourcesModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center">
        <div class="bg-zinc-900 border border-zinc-800 w-full max-w-2xl rounded-2xl p-6 shadow-2xl space-y-6">
            <div class="flex items-center justify-between border-b border-zinc-800 pb-4">
                <h3 class="font-bold text-white text-sm">⚙️ Reddit 监控源与阈值管理</h3>
                <button onclick="closeSourcesModal()" class="text-zinc-500 hover:text-white text-sm">✕ 关闭</button>
            </div>
            <div id="sourcesList" class="space-y-2 max-h-60 overflow-y-auto pr-2"></div>
            <!-- 添加新监控源表单 -->
            <form onsubmit="addSource(event)" class="grid grid-cols-6 gap-2 pt-2 border-t border-zinc-800">
                <input type="text" id="newSub" placeholder="Subreddit名(例: localollama)" required class="col-span-2 bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-1.5 text-xs text-white outline-none">
                <select id="newCat" class="bg-zinc-950 border border-zinc-800 rounded-lg px-2 py-1.5 text-xs text-white outline-none">
                    <option value="AI_DEV">AI_DEV</option>
                    <option value="FINANCE">FINANCE</option>
                </select>
                <input type="number" id="newScore" placeholder="最低分" value="30" class="bg-zinc-950 border border-zinc-800 rounded-lg px-2 py-1.5 text-xs text-white outline-none">
                <input type="number" step="0.05" id="newVel" placeholder="斜率" value="0.4" class="bg-zinc-950 border border-zinc-800 rounded-lg px-2 py-1.5 text-xs text-white outline-none">
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-medium">➕ 添加</button>
            </form>
        </div>
    </div>

    <!-- 底部 Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-emerald-600 text-white text-xs font-medium px-4 py-2.5 rounded-lg shadow-xl hidden transition-all z-50"></div>

<script>
let drafts = [];
let currentId = null;
let selectedHookIdx = 0;
let filters = { category: 'ALL', status: 'pending' };

function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.classList.remove('hidden');
    setTimeout(() => t.classList.add('hidden'), 2600);
}

function setFilter(key, val) {
    filters[key] = val;
    if (key === 'category') {
        ['ALL', 'AI_DEV', 'FINANCE'].forEach(c => {
            const btn = document.getElementById('cat-' + c);
            btn.className = c === val
                ? "px-3 py-1 rounded-md bg-zinc-800 text-white font-medium"
                : "px-3 py-1 rounded-md text-zinc-400 hover:text-white";
        });
    }
    loadDrafts();
}

async function loadDrafts() {
    const res = await fetch(`/api/drafts?category=${filters.category}&status=${filters.status}`);
    if (res.status === 401) {
        alert("认证失败，请检查浏览器 Basic Auth 密码");
        return;
    }
    drafts = await res.json();
    renderFeedList();
    if (drafts.length > 0) {
        const stillExists = drafts.find(d => d.post_id === currentId);
        selectDraft(stillExists ? currentId : drafts[0].post_id);
    } else {
        document.getElementById('editorPane').innerHTML = `<div class="h-full flex items-center justify-center text-zinc-600 text-sm">当前筛选条件下暂无草稿，可点击右上角「立即扫描 Reddit」</div>`;
    }
}

function renderFeedList() {
    const container = document.getElementById('feedList');
    if (!drafts.length) {
        container.innerHTML = `<div class="p-8 text-center text-zinc-600 text-sm">暂无数据</div>`;
        return;
    }
    container.innerHTML = drafts.map(d => {
        const isSelected = d.post_id === currentId;
        const badgeColor = d.category === 'AI_DEV' ? 'bg-sky-500/10 text-sky-400 border-sky-500/30' : 'bg-amber-500/10 text-amber-400 border-amber-500/30';
        return `
        <div onclick="selectDraft('${d.post_id}')" class="p-4 cursor-pointer transition hover:bg-zinc-900/70 ${isSelected ? 'bg-zinc-900 border-l-2 border-l-indigo-500' : ''}">
            <div class="flex items-center justify-between text-xs mb-1.5">
                <span class="px-2 py-0.5 rounded border ${badgeColor} font-mono">r/${d.subreddit}</span>
                <div class="flex items-center gap-2 text-zinc-400 font-mono">
                    <span title="增长斜率">⚡ ${d.velocity}/m</span>
                    <span title="评论争议比">🔥 ${d.controversy}</span>
                </div>
            </div>
            <h3 class="text-sm font-medium text-zinc-200 line-clamp-2 leading-snug mb-2 select-text">${d.title}</h3>
            <div class="flex items-center justify-between text-xs text-zinc-500">
                <span>▲ ${d.score} · 💬 ${d.num_comments}</span>
                <span class="text-indigo-400 font-mono text-[10px]">${d.narrative_framework || ''}</span>
            </div>
        </div>`;
    }).join('');
}

function selectDraft(postId) {
    currentId = postId;
    selectedHookIdx = 0;
    renderFeedList();
    renderEditor();
}

function renderEditor() {
    const item = drafts.find(d => d.post_id === currentId);
    if (!item) return;
    const hooks = item.hooks || [""];
    const metrics = item.card.metrics || [];

    const hooksHtml = hooks.map((h, idx) => `
        <div onclick="switchHook(${idx})" class="p-3 rounded-lg border cursor-pointer transition text-sm select-text ${idx === selectedHookIdx ? 'border-indigo-500 bg-indigo-950/20 text-zinc-100' : 'border-zinc-800 bg-zinc-900/50 text-zinc-400 hover:border-zinc-700'}">
            <div class="text-xs font-mono text-indigo-400 mb-1">HOOK 备选 #${idx + 1} ${idx === selectedHookIdx ? '(已激活)' : ''}</div>
            <div>${h}</div>
        </div>
    `).join('');

    const metricsHtml = metrics.map(m => {
        const dot = m.sentiment === 'positive' ? 'bg-emerald-400' : (m.sentiment === 'negative' ? 'bg-rose-400' : 'bg-sky-400');
        const border = m.sentiment === 'positive' ? 'border-emerald-500/30 bg-emerald-950/15' : (m.sentiment === 'negative' ? 'border-rose-500/30 bg-rose-950/15' : 'border-zinc-700/60 bg-zinc-900/70');
        return `
        <div class="p-3 rounded-lg border ${border} flex flex-col justify-between">
            <div class="flex items-center gap-2 mb-1">
                <span class="w-2 h-2 rounded-full ${dot}"></span>
                <span class="text-[11px] font-mono uppercase tracking-wider text-zinc-400">${m.label}</span>
            </div>
            <div class="text-xs font-semibold text-zinc-100 leading-snug">${m.value}</div>
        </div>`;
    }).join('');

    document.getElementById('editorPane').innerHTML = `
        <div class="max-w-6xl mx-auto space-y-6">
            <!-- 原帖信息与操作栏 -->
            <div class="flex items-center justify-between bg-zinc-900/80 border border-zinc-800 p-4 rounded-xl">
                <div class="space-y-1 pr-4">
                    <div class="text-xs text-zinc-400 flex items-center gap-2">
                        <span>叙事框架: <b class="text-indigo-400 font-mono">${item.narrative_framework}</b></span>
                        <span>· 原始来源:</span>
                        <a href="${item.permalink}" target="_blank" class="text-indigo-400 hover:underline font-mono">Reddit ↗</a>
                    </div>
                    <div class="text-sm font-semibold text-zinc-200 select-text">${item.title}</div>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                    <button onclick="markStatus('${item.post_id}', 'archived')" class="px-3 py-1.5 rounded-lg border border-zinc-700 hover:bg-zinc-800 text-xs text-zinc-300">🗑️ 归档跳过</button>
                    <button onclick="markStatus('${item.post_id}', 'published')" class="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-xs font-medium text-white">✅ 标记已发布</button>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <!-- 左列：Hook + 长推 + 狙击 (7列) -->
                <div class="lg:col-span-7 space-y-4">
                    <div>
                        <label class="text-xs font-mono uppercase text-zinc-400 block mb-2">1. 点击切换黄金前两行 (Hook Options)</label>
                        <div class="space-y-2">${hooksHtml}</div>
                    </div>

                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <label class="text-xs font-mono uppercase text-zinc-400">2. X 深度长推完整合成稿 (支持手动微调)</label>
                            <span id="wordCount" class="text-xs font-mono text-zinc-500"></span>
                        </div>
                        <textarea id="fullTweetBox" oninput="updateCount()" rows="13" class="w-full bg-zinc-900 border border-zinc-800 focus:border-indigo-500 rounded-xl p-4 text-sm text-zinc-100 leading-relaxed outline-none font-sans select-text">${item.long_post || ''}</textarea>

                        <div class="flex flex-wrap items-center gap-2 mt-3">
                            <button onclick="copyFullPost()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-4 py-2.5 rounded-lg">📋 复制完整长推</button>
                            <button onclick="openXIntent()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs font-medium px-4 py-2.5 rounded-lg border border-zinc-700">🚀 唤起 X 发帖页</button>
                            <button onclick="saveEdits()" class="ml-auto text-xs text-zinc-400 hover:text-white px-3 py-2">💾 保存修改</button>
                        </div>
                    </div>

                    <!-- 杀手锏：大V评论区狙击 -->
                    <div class="bg-zinc-900/50 border border-zinc-800/80 rounded-xl p-4 space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-mono text-amber-400 font-semibold">🎯 冲刺500粉截流武器库 (Reply Sniper)</span>
                            <button onclick="copyText('sniperBox', '已复制狙击短评！')" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-200 px-2.5 py-1 rounded">复制短评</button>
                        </div>
                        <textarea id="sniperBox" rows="2" class="w-full bg-transparent text-xs text-zinc-300 outline-none resize-none select-text">${item.sniper_reply || ''}</textarea>
                        <div class="pt-2 border-t border-zinc-800 flex items-center justify-between text-xs gap-2 flex-wrap">
                            <span class="text-zinc-500 font-mono">X搜索指令: <code class="text-indigo-300">${item.x_search_query || ''}</code></span>
                            <button onclick="openXSearch('${(item.x_search_query || '').replace(/'/g, "\\'")}')" class="bg-amber-600/20 text-amber-400 hover:bg-amber-600/30 border border-amber-500/30 px-3 py-1 rounded font-medium whitespace-nowrap">🔍 一键去 X 找大V贴截流 ↗</button>
                        </div>
                    </div>
                </div>

                <!-- 右列：视觉卡片 (5列) -->
                <div class="lg:col-span-5 space-y-4">
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-mono uppercase text-zinc-400">3. 原生暗黑信息图卡片 (16:9)</label>
                        <div class="flex gap-2">
                            <button onclick="copyCardAsImage()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3 py-1.5 rounded-lg">🖼️ 复制图片</button>
                            <button onclick="downloadCardPng()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs px-2.5 py-1.5 rounded-lg">⬇️ 下载 PNG</button>
                        </div>
                    </div>

                    <!-- 卡片画布 -->
                    <div id="visualCardCanvas" class="w-full aspect-video bg-gradient-to-br from-zinc-950 via-zinc-900 to-zinc-950 border border-zinc-800 rounded-2xl p-6 flex flex-col justify-between relative overflow-hidden shadow-2xl">
                        <div class="flex items-center justify-between border-b border-zinc-800/80 pb-3">
                            <div class="flex items-center gap-1.5">
                                <span class="w-2.5 h-2.5 rounded-full bg-rose-500/80"></span>
                                <span class="w-2.5 h-2.5 rounded-full bg-amber-500/80"></span>
                                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500/80"></span>
                                <span class="text-[11px] font-mono text-zinc-400 ml-2 uppercase tracking-widest">${item.category} // ${item.card.type || 'ALPHA'}</span>
                            </div>
                            <span class="text-[11px] font-mono text-indigo-400 bg-indigo-950/50 border border-indigo-500/30 px-2 py-0.5 rounded">REAL-WORLD SIGNAL</span>
                        </div>

                        <div class="my-2">
                            <h2 contenteditable="true" class="text-base font-bold text-white tracking-tight leading-snug outline-none">${item.card.title || item.title}</h2>
                        </div>

                        <div class="grid grid-cols-2 gap-2 my-auto">
                            ${metricsHtml}
                        </div>

                        <div class="flex items-center justify-between pt-3 border-t border-zinc-800/60 text-[10px] font-mono text-zinc-500">
                            <span>SYNTHESIZED FROM PRACTITIONER DEBATES</span>
                            <span contenteditable="true" class="text-zinc-400 outline-none">@YourHandle</span>
                        </div>
                    </div>
                    <p class="text-xs text-zinc-500 leading-relaxed">
                        💡 提示：点击卡片上的标题或水印可直接修改。点击「复制图片」后切到 X 发帖框按 <code>Ctrl+V</code> 即可附带高清图。
                    </p>
                </div>
            </div>
        </div>
    `;
    updateCount();
}

function switchHook(idx) {
    selectedHookIdx = idx;
    const item = drafts.find(d => d.post_id === currentId);
    if (!item) return;
    const hook = (item.hooks || [""])[selectedHookIdx] || "";
    const box = document.getElementById('fullTweetBox');
    const lines = box.value.split('\n\n');
    lines[0] = hook;
    box.value = lines.join('\n\n');
    updateCount();
    // Re-render hook highlights without full editor re-render
    renderFeedList();
}

function updateCount() {
    const box = document.getElementById('fullTweetBox');
    if (!box) return;
    const text = box.value;
    const words = text.trim().split(/\s+/).filter(Boolean).length;
    const el = document.getElementById('wordCount');
    if (el) el.innerText = `${words} 词 / ${text.length} 字符`;
}

function copyFullPost() {
    const box = document.getElementById('fullTweetBox');
    navigator.clipboard.writeText(box.value);
    showToast("📋 完整长推已复制到剪贴板！");
}

function copyText(elId, msg) {
    const val = document.getElementById(elId).value;
    navigator.clipboard.writeText(val);
    showToast(msg);
}

function openXIntent() {
    const text = document.getElementById('fullTweetBox').value;
    navigator.clipboard.writeText(text);
    showToast("📋 已复制！正在唤起 X 发帖页...");
    setTimeout(() => {
        window.open('https://twitter.com/intent/tweet', '_blank');
    }, 400);
}

function openXSearch(query) {
    const url = `https://twitter.com/search?q=${encodeURIComponent(query)}&src=typed_query&f=live`;
    window.open(url, '_blank');
}

async function markStatus(postId, newStatus) {
    await fetch(`/api/drafts/${postId}/status`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus })
    });
    showToast(newStatus === 'published' ? '✅ 已标记发布！' : '🗑️ 已归档');
    loadDrafts();
}

async function saveEdits() {
    const longPost = document.getElementById('fullTweetBox').value;
    const sniperReply = document.getElementById('sniperBox').value;
    await fetch(`/api/drafts/${currentId}/save`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ long_post: longPost, sniper_reply: sniperReply })
    });
    showToast("💾 已保存修改");
}

async function triggerScan() {
    const btn = document.getElementById('scanBtn');
    btn.innerHTML = '<span class="animate-spin">⏳</span><span>扫描中...</span>';
    btn.disabled = true;
    try {
        const res = await fetch('/api/scan', { method: 'POST' });
        const data = await res.json();
        showToast("🛰️ " + (data.message || "扫描已启动"));
        setTimeout(() => loadDrafts(), 8000);
    } catch (e) {
        showToast("❌ 扫描启动失败");
    } finally {
        setTimeout(() => {
            btn.innerHTML = '<span>⚡ 立即扫描 Reddit</span>';
            btn.disabled = false;
        }, 5000);
    }
}

async function copyCardAsImage() {
    const card = document.getElementById('visualCardCanvas');
    try {
        const blob = await htmlToImage.toBlob(card, { pixelRatio: 2 });
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        showToast("🖼️ 卡片图片已复制！去 X 发帖框 Ctrl+V 粘贴");
    } catch (e) {
        showToast("❌ 复制失败，请尝试下载 PNG");
    }
}

async function downloadCardPng() {
    const card = document.getElementById('visualCardCanvas');
    const dataUrl = await htmlToImage.toPng(card, { pixelRatio: 2 });
    const link = document.createElement('a');
    link.download = `alpha-card-${currentId}.png`;
    link.href = dataUrl;
    link.click();
    showToast("⬇️ PNG 已下载");
}

async function openSourcesModal() {
    document.getElementById('sourcesModal').classList.remove('hidden');
    const res = await fetch('/api/sources');
    const sources = await res.json();
    const container = document.getElementById('sourcesList');
    if (!sources.length) {
        container.innerHTML = `<p class="text-zinc-500 text-xs">暂无监控源</p>`;
        return;
    }
    container.innerHTML = sources.map(s => `
        <div class="flex items-center justify-between bg-zinc-950/80 border border-zinc-800 rounded-lg px-3 py-2 text-xs">
            <div class="flex items-center gap-3">
                <span class="font-mono text-zinc-200">r/${s.subreddit}</span>
                <span class="px-1.5 py-0.5 rounded text-[10px] ${s.category === 'AI_DEV' ? 'bg-sky-900/40 text-sky-400' : 'bg-amber-900/40 text-amber-400'}">${s.category}</span>
                <span class="text-zinc-500">▲≥${s.min_score} ⚡≥${s.min_velocity} 🔥≥${s.min_controversy}</span>
            </div>
            <button onclick="toggleSource(${s.id})" class="px-2 py-1 rounded ${s.enabled ? 'bg-emerald-600/20 text-emerald-400 border border-emerald-500/30' : 'bg-zinc-800 text-zinc-500 border border-zinc-700'} text-[10px] font-mono">
                ${s.enabled ? '● ON' : '○ OFF'}
            </button>
        </div>
    `).join('');
}

function closeSourcesModal() {
    document.getElementById('sourcesModal').classList.add('hidden');
}

async function toggleSource(id) {
    await fetch(`/api/sources/${id}/toggle`, { method: 'POST' });
    openSourcesModal();
}

async function addSource(e) {
    e.preventDefault();
    const payload = {
        subreddit: document.getElementById('newSub').value,
        category: document.getElementById('newCat').value,
        min_score: parseInt(document.getElementById('newScore').value),
        min_velocity: parseFloat(document.getElementById('newVel').value),
        min_controversy: 0.35
    };
    const res = await fetch('/api/sources', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });
    if (res.ok) {
        showToast(`✅ 已添加 r/${payload.subreddit}`);
        document.getElementById('newSub').value = '';
        openSourcesModal();
    } else {
        const err = await res.json();
        showToast(`❌ ${err.detail}`);
    }
}

// 初始化加载
loadDrafts();
</script>
</body>
</html>
