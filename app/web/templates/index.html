<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Personal Alpha Studio — X 爆款策展工作台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    <style>
        :root {
            --bg-color: #FAF8F5;
            --sidebar-bg: #F5F1EA;
            --card-bg: #FFFFFF;
            --text-main: #201E1C;
            --text-muted: #6E6860;
            --border-color: #E8E2D8;
            --claude-accent: #CC5A2B;
            --claude-accent-hover: #B84E22;
        }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Charter", Georgia, serif, monospace; 
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #D5CFB5; border-radius: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden select-none bg-[#FAF8F5]">

    <!-- 顶部告警条 (仅在未配置 GEMINI_API_KEY 时显示) -->
    <div id="keyAlert" class="bg-[#FFFBEB] border-b border-[#FDE68A] px-6 py-2 text-xs text-[#92400E] hidden items-center justify-between shrink-0 font-sans">
        <div class="flex items-center gap-2">
            <span>⚠️ <b>未检测到 GEMINI_API_KEY</b>：请在项目根目录的 <code>.env</code> 文件中配置密钥并重启服务，否则 AI 二创流水线将跳过合成。</span>
        </div>
        <a href="https://aistudio.google.com/" target="_blank" class="underline font-semibold hover:text-[#78350F]">免费获取 API Key ↗</a>
    </div>

    <!-- 顶部导航栏 (Claude 暖色纸质雅致风) -->
    <header class="h-14 border-b border-[#E8E2D8] bg-[#FFFFFF] px-6 flex items-center justify-between shrink-0 shadow-sm">
        <div class="flex items-center gap-3">
            <span class="w-2.5 h-2.5 rounded-full bg-[#386641] animate-pulse"></span>
            <h1 class="font-bold text-base tracking-tight text-[#201E1C] font-sans">
                PERSONAL ALPHA STUDIO 
                <span class="text-xs font-normal text-[#757067] ml-2 font-mono">Reddit + GitHub Trending → X Editorial Alpha</span>
            </h1>
        </div>
        <div class="flex items-center gap-3">
            <!-- 赛道筛选 -->
            <div class="flex bg-[#F3EFE9] p-1 rounded-lg border border-[#E3DDD2] text-xs font-sans">
                <button onclick="setFilter('category', 'ALL')" id="cat-ALL" class="px-3 py-1 rounded-md bg-[#FFFFFF] text-[#201E1C] font-medium shadow-sm">全部赛道</button>
                <button onclick="setFilter('category', 'GITHUB_TRENDING')" id="cat-GITHUB_TRENDING" class="px-3 py-1 rounded-md text-[#6E6860] hover:text-[#201E1C] flex items-center gap-1">⭐ GitHub 趋势</button>
                <button onclick="setFilter('category', 'AI_DEV')" id="cat-AI_DEV" class="px-3 py-1 rounded-md text-[#6E6860] hover:text-[#201E1C]">AI / 开发</button>
                <button onclick="setFilter('category', 'FINANCE')" id="cat-FINANCE" class="px-3 py-1 rounded-md text-[#6E6860] hover:text-[#201E1C]">金融 / 交易</button>
            </div>
            <!-- 状态筛选 -->
            <select id="statusSelect" onchange="setFilter('status', this.value)" class="bg-[#FFFFFF] border border-[#E0DBD2] text-xs text-[#3A3630] rounded-lg px-3 py-1.5 outline-none font-sans">
                <option value="pending">待发布草稿 (Pending)</option>
                <option value="published">已发布 (Published)</option>
                <option value="archived">已归档跳过 (Archived)</option>
            </select>
            <button onclick="openSourcesModal()" class="bg-[#F3EFE9] hover:bg-[#EAE4D9] text-[#3D3933] text-xs font-medium px-3.5 py-1.5 rounded-lg border border-[#E0DBD0] transition font-sans">⚙️ 监控源配置</button>
            <button onclick="triggerScan()" id="scanBtn" class="bg-[#CC5A2B] hover:bg-[#B84E22] text-white text-xs font-medium px-3.5 py-1.5 rounded-lg transition flex items-center gap-1.5 shadow-sm font-sans">
                <span>⚡ 扫描全网 (Reddit+GitHub)</span>
            </button>
            <div class="h-4 w-[1px] bg-[#E2DBD0] mx-1"></div>
            <button onclick="logout()" title="退出工作台" class="text-[#7A746B] hover:text-[#C53030] hover:bg-[#FFF5F5] text-xs px-2.5 py-1.5 rounded-lg border border-[#EAE4DA] transition flex items-center gap-1 font-sans">
                <span>🚪 退出</span>
            </button>
        </div>
    </header>

    <!-- 主体分栏 -->
    <div class="flex-1 flex overflow-hidden">
        <!-- 左侧：高信噪比情报源队列 (温润卡片列表) -->
        <aside class="w-1/3 max-w-md border-r border-[#E8E2D8] bg-[#F5F1EA] overflow-y-auto divide-y divide-[#ECE7DC]" id="feedList">
            <div class="p-8 text-center text-[#7A746B] text-sm">正在加载本地草稿库...</div>
        </aside>

        <!-- 右侧：推文精修 + 视觉卡片工作室 -->
        <main class="flex-1 overflow-y-auto p-6 bg-[#FAF8F5]" id="editorPane">
            <div class="h-full flex flex-col items-center justify-center text-[#8C867D] text-sm">
                👈 点击左侧任意情报卡片，进入二创精修与配图渲染
            </div>
        </main>
    </div>

    <!-- 监控源管理弹窗 -->
    <div id="sourcesModal" class="fixed inset-0 bg-[#2D2A26]/40 backdrop-blur-sm z-50 hidden flex items-center justify-center">
        <div class="bg-[#FFFFFF] border border-[#E5DFD4] w-full max-w-2xl rounded-2xl p-6 shadow-2xl space-y-6">
            <div class="flex items-center justify-between border-b border-[#EFEAE2] pb-4">
                <h3 class="font-bold text-[#201E1C] text-sm font-sans">⚙️ 社区监控源与过滤阈值</h3>
                <button onclick="closeSourcesModal()" class="text-[#8C867D] hover:text-[#201E1C] text-sm font-mono">✕ 关闭</button>
            </div>
            <div id="sourcesList" class="space-y-2 max-h-60 overflow-y-auto pr-2"></div>
            <!-- 添加新监控源表单 -->
            <form onsubmit="addSource(event)" class="grid grid-cols-6 gap-2 pt-2 border-t border-[#EFEAE2]">
                <input type="text" id="newSub" placeholder="Subreddit名(例: BitcoinMarkets)" required class="col-span-2 bg-[#FAF8F5] border border-[#E0DBD2] rounded-lg px-3 py-1.5 text-xs text-[#201E1C] outline-none">
                <select id="newCat" class="bg-[#FAF8F5] border border-[#E0DBD2] rounded-lg px-2 py-1.5 text-xs text-[#201E1C] outline-none">
                    <option value="AI_DEV">AI_DEV</option>
                    <option value="FINANCE">FINANCE</option>
                </select>
                <input type="number" id="newScore" placeholder="最低分" value="30" class="bg-[#FAF8F5] border border-[#E0DBD2] rounded-lg px-2 py-1.5 text-xs text-[#201E1C] outline-none">
                <input type="number" step="0.05" id="newVel" placeholder="斜率" value="0.4" class="bg-[#FAF8F5] border border-[#E0DBD2] rounded-lg px-2 py-1.5 text-xs text-[#201E1C] outline-none">
                <button type="submit" class="bg-[#CC5A2B] hover:bg-[#B84E22] text-white rounded-lg text-xs font-medium shadow-sm">➕ 添加</button>
            </form>
        </div>
    </div>

    <!-- 底部 Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-[#201E1C] text-white text-xs font-medium px-4 py-2.5 rounded-lg shadow-xl hidden transition-all z-50 font-sans"></div>

<script>
let drafts = [];
let currentId = null;
let selectedHookIdx = 0;
let currentFormat = 'long'; // 'long' (深度长推) | 'short' (极简短推)
let filters = { category: 'ALL', status: 'pending' };
let appConfig = { x_handle: '@YourHandle', has_gemini_key: true };

function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.classList.remove('hidden');
    setTimeout(() => t.classList.add('hidden'), 2600);
}

async function loadConfig() {
    try {
        const res = await fetch('/api/config');
        if (res.status === 401) {
            window.location.href = '/login';
            return;
        }
        if (res.ok) {
            appConfig = await res.json();
            if (!appConfig.has_gemini_key) {
                document.getElementById('keyAlert').classList.remove('hidden');
                document.getElementById('keyAlert').classList.add('flex');
            }
        }
    } catch (e) {
        console.warn("Config load failed", e);
    }
}

async function logout() {
    if (confirm("确定要退出当前工作台吗？")) {
        try {
            await fetch('/api/logout', { method: 'POST' });
        } catch (e) {}
        window.location.href = '/login';
    }
}

function setFilter(key, val) {
    filters[key] = val;
    if (key === 'category') {
        ['ALL', 'GITHUB_TRENDING', 'AI_DEV', 'FINANCE'].forEach(c => {
            const btn = document.getElementById('cat-' + c);
            if (btn) {
                btn.className = c === val
                    ? "px-3 py-1 rounded-md bg-[#FFFFFF] text-[#201E1C] font-medium shadow-sm"
                    : "px-3 py-1 rounded-md text-[#6E6860] hover:text-[#201E1C]";
            }
        });
    }
    loadDrafts();
}

async function loadDrafts() {
    const res = await fetch(`/api/drafts?category=${filters.category}&status=${filters.status}`);
    if (res.status === 401) {
        window.location.href = '/login';
        return;
    }
    drafts = await res.json();
    renderFeedList();
    if (drafts.length > 0) {
        const stillExists = drafts.find(d => d.post_id === currentId);
        selectDraft(stillExists ? currentId : drafts[0].post_id);
    } else {
        document.getElementById('editorPane').innerHTML = `<div class="h-full flex items-center justify-center text-[#8C867D] text-sm">当前筛选条件下暂无草稿，可点击右上角「⚡ 扫描全网情报」</div>`;
    }
}

function renderFeedList() {
    const container = document.getElementById('feedList');
    if (!drafts.length) {
        container.innerHTML = `<div class="p-8 text-center text-[#8C867D] text-sm">暂无数据</div>`;
        return;
    }
    container.innerHTML = drafts.map(d => {
        const isSelected = d.post_id === currentId;
        const isGithub = d.category === 'GITHUB_TRENDING';
        
        let badgeColor = 'bg-[#FEF3E2] text-[#B45309] border-[#FDE68A]';
        if (isGithub) {
            badgeColor = 'bg-[#F3EFFB] text-[#553C9A] border-[#DDD3F5]';
        } else if (d.category === 'AI_DEV') {
            badgeColor = 'bg-[#EBF3FA] text-[#1E6091] border-[#D0E3F3]';
        }

        const tier = d.content_tier || 'DEEP_DIVE_MEMO';
        let tierBadge = `<span class="px-1.5 py-0.5 rounded text-[10px] font-mono bg-[#EEF2FF] text-[#4338CA] border border-[#E0E7FF]">📜 深度长文</span>`;
        if (tier === 'FLASH_PUNCH') {
            tierBadge = `<span class="px-1.5 py-0.5 rounded text-[10px] font-mono bg-[#FFF7ED] text-[#C2410C] border border-[#FFEDD5]">⚡ 极简短推</span>`;
        } else if (tier === 'DEBATE_ROUNDTABLE') {
            tierBadge = `<span class="px-1.5 py-0.5 rounded text-[10px] font-mono bg-[#FEF2F2] text-[#B91C1C] border border-[#FEE2E2]">🥊 争议圆桌</span>`;
        }

        const metricsSnippet = isGithub
            ? `<div class="flex items-center gap-1.5 text-[#553C9A] font-mono text-xs">
                   <span>⭐ +${d.score} stars today</span>
               </div>`
            : `<div class="flex items-center gap-2 text-[#7A746B] font-mono text-xs">
                   <span title="增长斜率">⚡ ${d.velocity}/m</span>
                   <span title="评论争议比">🔥 ${d.controversy}</span>
               </div>`;

        const footerSnippet = isGithub
            ? `<div class="flex items-center gap-1.5"><span>🐙 开源拆解</span>${tierBadge}</div>
               <span class="text-[#553C9A] font-mono text-[10px]">${d.narrative_framework || 'Repo Teardown'}</span>`
            : `<div class="flex items-center gap-1.5"><span>▲ ${d.score} · 💬 ${d.num_comments}</span>${tierBadge}</div>
               <span class="text-[#CC5A2B] font-mono text-[10px]">${d.narrative_framework || ''}</span>`;

        return `
        <div onclick="selectDraft('${d.post_id}')" class="p-4 cursor-pointer transition hover:bg-[#FFFFFF]/70 ${isSelected ? 'bg-[#FFFFFF] border-l-4 border-l-[#CC5A2B] shadow-sm' : ''}">
            <div class="flex items-center justify-between text-xs mb-1.5">
                <span class="px-2 py-0.5 rounded border ${badgeColor} font-mono">${isGithub ? '🐙 ' + d.subreddit : 'r/' + d.subreddit}</span>
                ${metricsSnippet}
            </div>
            <h3 class="text-sm font-semibold text-[#201E1C] line-clamp-2 leading-snug mb-2 select-text font-sans">${d.title}</h3>
            <div class="flex items-center justify-between text-xs text-[#7A746B]">
                ${footerSnippet}
            </div>
        </div>`;
    }).join('');
}

function selectDraft(postId) {
    currentId = postId;
    selectedHookIdx = 0;
    const item = drafts.find(d => d.post_id === currentId);
    if (item && item.content_tier === 'FLASH_PUNCH') {
        currentFormat = 'short';
    } else {
        currentFormat = 'long';
    }
    renderFeedList();
    renderEditor();
}

function renderEditor() {
    const item = drafts.find(d => d.post_id === currentId);
    if (!item) return;
    const hooks = item.hooks || [""];
    const metrics = item.card.metrics || [];
    const isGithub = item.category === 'GITHUB_TRENDING';

    const hooksHtml = hooks.map((h, idx) => `
        <div onclick="switchHook(${idx})" class="p-3 rounded-lg border cursor-pointer transition text-sm select-text ${idx === selectedHookIdx ? 'border-[#CC5A2B] bg-[#FFF8F5] text-[#201E1C] ring-1 ring-[#CC5A2B]/20 shadow-sm' : 'border-[#E5DFD4] bg-[#FFFFFF] text-[#4A453E] hover:border-[#CC5A2B]/40 hover:bg-[#FAF8F5]'}">
            <div class="text-xs font-mono text-[#CC5A2B] mb-1 font-medium">HOOK 备选 #${idx + 1} ${idx === selectedHookIdx ? '(已激活)' : ''}</div>
            <div class="leading-relaxed font-sans">${h}</div>
        </div>
    `).join('');

    const metricsHtml = metrics.map(m => {
        const dot = m.sentiment === 'positive' ? 'bg-[#2E7D32]' : (m.sentiment === 'negative' ? 'bg-[#C0392B]' : 'bg-[#706B63]');
        const border = m.sentiment === 'positive' ? 'border-[#C4DECA] bg-[#EDF6EE] text-[#1B4D2E]' : (m.sentiment === 'negative' ? 'border-[#F7CCD0] bg-[#FDF0F1] text-[#7A1C24]' : 'border-[#E5DFD4] bg-[#FFFFFF] text-[#2E2B27]');
        return `
        <div class="p-3 rounded-lg border ${border} flex flex-col justify-between shadow-xs">
            <div class="flex items-center gap-2 mb-1">
                <span class="w-2 h-2 rounded-full ${dot}"></span>
                <span class="text-[11px] font-mono uppercase tracking-wider text-[#757067] font-semibold">${m.label}</span>
            </div>
            <div class="text-xs font-semibold leading-snug font-sans">${m.value}</div>
        </div>`;
    }).join('');

    const sourceLabel = isGithub ? 'GitHub ↗' : 'Reddit ↗';
    const sourceClass = isGithub ? 'text-[#553C9A]' : 'text-[#CC5A2B]';

    // 格式与等级信息
    const tier = item.content_tier || 'DEEP_DIVE_MEMO';
    let tierText = '📜 建议深度长推（高书签权重）';
    if (tier === 'FLASH_PUNCH') tierText = '⚡ 建议极简短推（高完播完转）';
    else if (tier === 'DEBATE_ROUNDTABLE') tierText = '🥊 建议争议圆桌（引爆评论互动）';

    // 组合当前选中格式的推文（Hook + 正文）
    const activeHook = hooks[selectedHookIdx] || "";
    const activeBody = (currentFormat === 'short' && item.short_post) ? item.short_post : (item.long_post || '');
    const fullTweetText = activeHook ? `${activeHook}\n\n${activeBody}` : activeBody;

    document.getElementById('editorPane').innerHTML = `
        <div class="max-w-6xl mx-auto space-y-6">
            <!-- 原帖信息与操作栏 (温和纸白面板) -->
            <div class="flex items-center justify-between bg-[#FFFFFF] border border-[#E8E2D8] p-4 rounded-xl shadow-sm">
                <div class="space-y-1 pr-4">
                    <div class="text-xs text-[#7A746B] flex items-center gap-2 font-sans">
                        <span>叙事框架: <b class="${sourceClass} font-mono">${item.narrative_framework || 'Alpha Synthesis'}</b></span>
                        <span>· 原始来源:</span>
                        <a href="${item.permalink}" target="_blank" class="${sourceClass} hover:underline font-mono">${sourceLabel}</a>
                    </div>
                    <div class="text-sm font-semibold text-[#201E1C] select-text font-sans">${item.title}</div>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                    <button onclick="markStatus('${item.post_id}', 'archived')" class="px-3 py-1.5 rounded-lg border border-[#DDD6C8] hover:bg-[#F3EFE9] text-xs text-[#524E48] transition font-sans">🗑️ 归档跳过</button>
                    <button onclick="markStatus('${item.post_id}', 'published')" class="px-3 py-1.5 rounded-lg bg-[#386641] hover:bg-[#2F5236] text-xs font-medium text-white transition shadow-sm font-sans">✅ 标记已发布</button>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <!-- 左列：Hook + 长短文 + 狙击 (7列) -->
                <div class="lg:col-span-7 space-y-4">
                    <div>
                        <label class="text-xs font-mono uppercase text-[#7A746B] block mb-2 font-medium">1. 点击切换黄金前两行 (Hook Options)</label>
                        <div class="space-y-2">${hooksHtml}</div>
                    </div>

                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center gap-2 flex-wrap">
                                <label class="text-xs font-mono uppercase text-[#7A746B] font-medium">2. X 发帖文案</label>
                                <!-- 长短模式切换分段按钮 -->
                                <div class="flex bg-[#F3EFE9] p-0.5 rounded-lg border border-[#E0DBD0] text-xs font-sans">
                                    <button type="button" onclick="switchFormat('short')" id="fmt-short" class="px-2.5 py-1 rounded-md transition flex items-center gap-1 ${currentFormat === 'short' ? 'bg-[#CC5A2B] text-white font-medium shadow-sm' : 'text-[#6E6860] hover:text-[#201E1C]'}">
                                        <span>⚡ 极简短推 (Short)</span>
                                    </button>
                                    <button type="button" onclick="switchFormat('long')" id="fmt-long" class="px-2.5 py-1 rounded-md transition flex items-center gap-1 ${currentFormat === 'long' ? 'bg-[#CC5A2B] text-white font-medium shadow-sm' : 'text-[#6E6860] hover:text-[#201E1C]'}">
                                        <span>📜 深度长文 (Long)</span>
                                    </button>
                                </div>
                                <span class="text-[11px] font-mono text-[#7A746B] bg-[#F5F1EA] border border-[#E5DFD4] px-2 py-0.5 rounded">${tierText}</span>
                            </div>
                            <span id="wordCount" class="text-xs font-mono text-[#8C867D]"></span>
                        </div>
                        <textarea id="fullTweetBox" oninput="updateCount()" rows="13" class="w-full bg-[#FFFFFF] border border-[#E0DBD0] focus:border-[#CC5A2B] focus:ring-2 focus:ring-[#CC5A2B]/10 rounded-xl p-4 text-sm text-[#201E1C] leading-relaxed outline-none font-sans select-text shadow-xs">${fullTweetText}</textarea>

                        <div class="flex flex-wrap items-center gap-2 mt-3 font-sans">
                            <button onclick="copyFullPost()" class="bg-[#CC5A2B] hover:bg-[#B84E22] text-white text-xs font-semibold px-4 py-2.5 rounded-lg shadow-sm transition">📋 复制当前推文</button>
                            <button onclick="openXIntent()" class="bg-[#F0EBE1] hover:bg-[#E7E0D2] text-[#2C2924] text-xs font-medium px-4 py-2.5 rounded-lg border border-[#DDD6C8] transition">🚀 唤起 X 发帖页</button>
                            <button onclick="saveEdits()" class="ml-auto text-xs text-[#757067] hover:text-[#201E1C] px-3 py-2 transition">💾 保存修改</button>
                        </div>
                    </div>

                    <!-- 杀手锏：大V评论区狙击 (Reply Sniper) -->
                    <div class="bg-[#FDFBF7] border border-[#EBE4D8] rounded-xl p-4 space-y-3 shadow-xs">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-mono text-[#B45309] font-semibold">🎯 冲刺500粉截流武器库 (Reply Sniper)</span>
                            <button onclick="copyText('sniperBox', '已复制狙击短评！')" class="text-xs bg-[#F3EFE9] hover:bg-[#EAE4D9] text-[#3D3933] px-2.5 py-1 rounded border border-[#E0DBD0] font-sans">复制短评</button>
                        </div>
                        <textarea id="sniperBox" rows="2" class="w-full bg-transparent text-xs text-[#2B2823] outline-none resize-none select-text leading-relaxed font-sans">${item.sniper_reply || ''}</textarea>
                        <div class="pt-2 border-t border-[#EFEAE2] flex items-center justify-between text-xs gap-2 flex-wrap font-sans">
                            <span class="text-[#7A746B] font-mono">X搜索指令: <code class="bg-[#F0EBE1] text-[#9A3412] px-1.5 py-0.5 rounded border border-[#E2DBD0] select-all">${item.x_search_query || ''}</code></span>
                            <button onclick="triggerXSearch()" class="bg-[#FFF7ED] text-[#C2410C] hover:bg-[#FFEDD5] border border-[#FDBA74] px-3 py-1 rounded font-medium whitespace-nowrap transition">🔍 一键去 X 找大V贴截流 ↗</button>
                        </div>
                    </div>
                </div>

                <!-- 右列：视觉卡片 (5列 · Claude 雅致纸本文档风) -->
                <div class="lg:col-span-5 space-y-4">
                    <div class="flex items-center justify-between font-sans">
                        <label class="text-xs font-mono uppercase text-[#7A746B] font-medium">3. 雅致信息图卡片 (16:9)</label>
                        <div class="flex gap-2">
                            <button onclick="copyCardAsImage()" class="bg-[#386641] hover:bg-[#2F5236] text-white text-xs font-semibold px-3 py-1.5 rounded-lg shadow-sm transition">🖼️ 复制图片</button>
                            <button onclick="downloadCardPng()" class="bg-[#F0EBE1] hover:bg-[#E7E0D2] text-[#3D3933] text-xs px-2.5 py-1.5 rounded-lg border border-[#DDD6C8] transition">⬇️ 下载 PNG</button>
                        </div>
                    </div>

                    <!-- 卡片画布 (Claude Warm Editorial Paper Card) -->
                    <div id="visualCardCanvas" class="w-full aspect-video bg-gradient-to-br from-[#FFFDF9] via-[#FAF7F2] to-[#F5F0E8] border-2 border-[#DDD6C8] rounded-2xl p-6 flex flex-col justify-between relative overflow-hidden shadow-md">
                        <div class="flex items-center justify-between border-b border-[#E6E0D4] pb-3">
                            <div class="flex items-center gap-1.5">
                                <span class="w-2.5 h-2.5 rounded-full bg-[#E06A55]"></span>
                                <span class="w-2.5 h-2.5 rounded-full bg-[#E5A93C]"></span>
                                <span class="w-2.5 h-2.5 rounded-full bg-[#5A9E6F]"></span>
                                <span class="text-[11px] font-mono text-[#7A746B] ml-2 uppercase tracking-widest font-semibold">${item.category} // ${item.card.type || 'ALPHA'}</span>
                            </div>
                            <span class="text-[11px] font-mono ${isGithub ? 'text-[#553C9A] bg-[#F3EFFB] border-[#DDD3F5]' : 'text-[#CC5A2B] bg-[#FFF2ED] border-[#FCD9CC]'} border px-2 py-0.5 rounded font-semibold">${isGithub ? 'GITHUB ALPHA' : 'RESEARCH MEMO'}</span>
                        </div>

                        <div class="my-2">
                            <h2 contenteditable="true" class="text-base font-bold text-[#1C1A17] tracking-tight leading-snug outline-none font-sans">${item.card.title || item.title}</h2>
                        </div>

                        <div class="grid grid-cols-2 gap-2 my-auto">
                            ${metricsHtml}
                        </div>

                        <div class="flex items-center justify-between pt-3 border-t border-[#E6E0D4] text-[10px] font-mono text-[#8C867D]">
                            <span>${isGithub ? 'SYNTHESIZED FROM GITHUB OPEN SOURCE ARCHITECTURES' : 'SYNTHESIZED FROM PRACTITIONER INSIGHTS'}</span>
                            <span contenteditable="true" class="text-[#CC5A2B] font-semibold outline-none">${appConfig.x_handle || '@YourHandle'}</span>
                        </div>
                    </div>
                    <p class="text-xs text-[#7A746B] leading-relaxed font-sans">
                        💡 提示：点击卡片上的标题或水印可直接修改。点击「复制图片」后切到 X 发帖框按 <code>Ctrl+V</code> 即可附带高清图。
                    </p>
                </div>
            </div>
        </div>
    `;
    updateCount();
}

function switchHook(idx) {
    selectedHookIdx = idx;
    const item = drafts.find(d => d.post_id === currentId);
    if (!item) return;
    const hooks = item.hooks || [""];
    const newHook = hooks[selectedHookIdx] || "";
    const box = document.getElementById('fullTweetBox');
    if (box) {
        // 将第一段替换为新选择的 Hook，保留用户对正文的修改
        const parts = box.value.split('\n\n');
        if (parts.length > 1) {
            parts[0] = newHook;
            box.value = parts.join('\n\n');
        } else {
            box.value = newHook ? `${newHook}\n\n${box.value}` : box.value;
        }
        updateCount();
    }
    renderFeedList();
}

function switchFormat(fmt) {
    currentFormat = fmt;
    const item = drafts.find(d => d.post_id === currentId);
    if (!item) return;

    const btnShort = document.getElementById('fmt-short');
    const btnLong = document.getElementById('fmt-long');
    if (btnShort && btnLong) {
        if (fmt === 'short') {
            btnShort.className = 'px-2.5 py-1 rounded-md transition flex items-center gap-1 bg-[#CC5A2B] text-white font-medium shadow-sm';
            btnLong.className = 'px-2.5 py-1 rounded-md transition flex items-center gap-1 text-[#6E6860] hover:text-[#201E1C]';
        } else {
            btnShort.className = 'px-2.5 py-1 rounded-md transition flex items-center gap-1 text-[#6E6860] hover:text-[#201E1C]';
            btnLong.className = 'px-2.5 py-1 rounded-md transition flex items-center gap-1 bg-[#CC5A2B] text-white font-medium shadow-sm';
        }
    }

    const hooks = item.hooks || [""];
    const activeHook = hooks[selectedHookIdx] || "";
    const activeBody = (fmt === 'short' && item.short_post) ? item.short_post : (item.long_post || '');
    const box = document.getElementById('fullTweetBox');
    if (box) {
        box.value = activeHook ? `${activeHook}\n\n${activeBody}` : activeBody;
        updateCount();
    }
}

function updateCount() {
    const box = document.getElementById('fullTweetBox');
    if (!box) return;
    const text = box.value;
    const words = text.trim().split(/\s+/).filter(Boolean).length;
    const el = document.getElementById('wordCount');
    if (el) el.innerText = `${words} 词 / ${text.length} 字符`;
}

function copyFullPost() {
    const box = document.getElementById('fullTweetBox');
    navigator.clipboard.writeText(box.value);
    showToast(`📋 已复制${currentFormat === 'short' ? '极简短推' : '深度长文'}到剪贴板！`);
}

function copyText(elId, msg) {
    const val = document.getElementById(elId).value;
    navigator.clipboard.writeText(val);
    showToast(msg);
}

function openXIntent() {
    const text = document.getElementById('fullTweetBox').value;
    navigator.clipboard.writeText(text);
    showToast("📋 已复制！正在唤起 X 发帖页...");
    setTimeout(() => {
        window.open('https://x.com/compose/post', '_blank');
    }, 300);
}

function triggerXSearch() {
    const item = drafts.find(d => d.post_id === currentId);
    if (!item || !item.x_search_query) {
        showToast("⚠️ 当前草稿无有效搜索词");
        return;
    }
    const url = `https://x.com/search?q=${encodeURIComponent(item.x_search_query)}&src=typed_query&f=live`;
    window.open(url, '_blank');
}

async function markStatus(postId, newStatus) {
    await fetch(`/api/drafts/${postId}/status`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus })
    });
    showToast(newStatus === 'published' ? '✅ 已标记发布！' : '🗑️ 已归档');
    loadDrafts();
}

async function saveEdits() {
    const item = drafts.find(d => d.post_id === currentId);
    if (!item) return;
    const box = document.getElementById('fullTweetBox');
    const sniperReply = document.getElementById('sniperBox').value;
    const parts = box.value.split('\n\n');
    const bodyOnly = parts.length > 1 ? parts.slice(1).join('\n\n') : box.value;

    if (currentFormat === 'short') {
        item.short_post = bodyOnly;
    } else {
        item.long_post = bodyOnly;
    }
    item.sniper_reply = sniperReply;

    await fetch(`/api/drafts/${currentId}/save`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
            long_post: item.long_post || '', 
            short_post: item.short_post || '', 
            sniper_reply: sniperReply 
        })
    });
    showToast("💾 已保存修改");
}

async function triggerScan() {
    const btn = document.getElementById('scanBtn');
    btn.innerHTML = '<span class="animate-spin">⏳</span><span>扫描全网中...</span>';
    btn.disabled = true;
    try {
        const res = await fetch('/api/scan', { method: 'POST' });
        const data = await res.json();
        showToast("🛰️ " + (data.message || "全网扫描已启动"));
        setTimeout(() => loadDrafts(), 6000);
    } catch (e) {
        showToast("❌ 扫描启动失败");
    } finally {
        setTimeout(() => {
            btn.innerHTML = '<span>⚡ 扫描全网 (Reddit+GitHub)</span>';
            btn.disabled = false;
        }, 4000);
    }
}

async function copyCardAsImage() {
    const card = document.getElementById('visualCardCanvas');
    try {
        const blob = await htmlToImage.toBlob(card, { pixelRatio: 2.5 });
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        showToast("🖼️ 卡片图片已复制！去 X 发帖框 Ctrl+V 粘贴");
    } catch (e) {
        showToast("⚠️ 建议使用旁边的「下载 PNG」按钮");
    }
}

async function downloadCardPng() {
    const card = document.getElementById('visualCardCanvas');
    const dataUrl = await htmlToImage.toPng(card, { pixelRatio: 2.5 });
    const link = document.createElement('a');
    link.download = `alpha-card-${currentId}.png`;
    link.href = dataUrl;
    link.click();
}

async function openSourcesModal() {
    document.getElementById('sourcesModal').classList.remove('hidden');
    const res = await fetch('/api/sources');
    const sources = await res.json();
    document.getElementById('sourcesList').innerHTML = sources.map(s => `
        <div class="flex items-center justify-between bg-[#FAF8F5] border border-[#E5DFD4] p-3 rounded-lg text-xs">
            <div>
                <span class="font-bold text-[#201E1C]">r/${s.subreddit}</span>
                <span class="text-[#7A746B] ml-2 font-mono">(${s.category})</span>
                <span class="text-[#8C867D] ml-3 font-mono">最低分:${s.min_score} | 斜率:${s.min_velocity}</span>
            </div>
            <button onclick="toggleSource(${s.id})" class="px-2.5 py-1 rounded font-medium transition ${s.enabled ? 'bg-[#EDF6EE] text-[#1B4D2E] border border-[#C4DECA]' : 'bg-[#EAE4D9] text-[#7A746B]'}">
                ${s.enabled ? '启用中' : '已禁用'}
            </button>
        </div>
    `).join('');
}

function closeSourcesModal() {
    document.getElementById('sourcesModal').classList.add('hidden');
    loadDrafts();
}

async function toggleSource(id) {
    await fetch(`/api/sources/${id}/toggle`, { method: 'POST' });
    openSourcesModal();
}

async function addSource(e) {
    e.preventDefault();
    const payload = {
        subreddit: document.getElementById('newSub').value,
        category: document.getElementById('newCat').value,
        min_score: parseInt(document.getElementById('newScore').value) || 30,
        min_velocity: parseFloat(document.getElementById('newVel').value) || 0.4,
        min_controversy: 0.35
    };
    const res = await fetch('/api/sources', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });
    if (res.ok) {
        document.getElementById('newSub').value = '';
        openSourcesModal();
        showToast("✅ 监控源添加成功");
    } else {
        const err = await res.json();
        alert(err.detail);
    }
}

// 启动执行：加载配置与数据
loadConfig();
loadDrafts();
</script>
</body>
</html>
